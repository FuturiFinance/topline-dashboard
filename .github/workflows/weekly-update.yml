name: Weekly Dashboard Update

on:
  schedule:
    # Run every Monday at 7AM UTC (2AM EST / 3AM EDT)
    - cron: '0 7 * * 1'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install scraper dependencies
        working-directory: ./scraper
        run: npm ci

      - name: Install Puppeteer browser
        working-directory: ./scraper
        run: npx puppeteer browsers install chrome

      - name: Run scraper
        working-directory: ./scraper
        env:
          TOPLINE_EMAIL: ${{ secrets.TOPLINE_EMAIL }}
          TOPLINE_PASSWORD: ${{ secrets.TOPLINE_PASSWORD }}
        run: node scrape-topline.js

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/public/data/topline-stats.json
          git diff --staged --quiet || git commit -m "Update TopLine data [automated]"
          git push
